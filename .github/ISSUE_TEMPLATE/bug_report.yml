name: "Bug Report"
description: "Report a bug or unexpected behavior in Production RAG"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill out the form below.
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "A clear and concise description of what the bug is."
      placeholder: "When running `rag query ...`, the following error occurred..."
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: "Active LLM / Provider"
      options:
        - "Ollama (Local)"
        - "OpenAI"
        - "Gemini"
        - "Anthropic"
        - "Groq"
        - "DeepSeek"
        - "Mock / Offline"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Terminal / Server Logs"
      description: "Paste relevant error traces or output from `rag doctor`."
      render: shell
