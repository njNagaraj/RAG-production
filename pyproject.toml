[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag"
version = "1.0.0"
description = "Enterprise Developer-Agnostic, Local-First RAG Engine with Hybrid Search, Pluggable Providers & Multi-Tenancy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Production RAG Team" }
]
keywords = [
    "rag", "retrieval-augmented-generation", "pgvector", "hybrid-search",
    "reranking", "cross-encoder", "ollama", "openai", "gemini", "anthropic",
    "vector-database", "fastembed", "enterprise-search"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "gunicorn>=21.2.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psycopg[binary]>=3.1.18",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.2.5",
    "pypdf>=4.1.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.18",
    "fastembed>=0.3.0",
    "tokenizers>=0.15.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
    "docling>=2.0.0",
]

[project.optional-dependencies]
all = [
    "google-genai>=0.1.1",
    "openai>=1.14.0",
    "anthropic>=0.20.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
rag = "main:main"

[project.urls]
Homepage = "https://github.com/njNagaraj/RAG-production"
Repository = "https://github.com/njNagaraj/RAG-production.git"
Issues = "https://github.com/njNagaraj/RAG-production/issues"
Documentation = "https://github.com/njNagaraj/RAG-production#readme"
